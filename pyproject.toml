[project]
name = "babi"
version = "0.1.0"
description = "Generate parsers from PEG grammars"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "parsy>=2.1",
  "click>=8.0",
]

[project.scripts]
babi = "babi.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["babi"]
